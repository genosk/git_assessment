<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-Item</title>
</head>
<body>

    <p>Hello Everyone! Welcome to the To-Do Item Page.</p>
        
    {% if error %}
        <p class="centered" style="color:red;">{{ error }}</p>
    {% endif %}

    <form id="todoForm">
        <label for="itemname">Item Name:</label>
        <input type="text" id="itemname" name="itemname" placeholder="Enter the Item Name"><br><br>
        <label for="itemdescription">Item Description:</label>
        <input type="text" id="itemdescription" name="itemdescription" placeholder="Enter the description"><br><br>
        <button type="submit">Submit</button>
    </form>

    <script>
        document.getElementById('todoForm').addEventListener('submit', function(e) {
            e.preventDefault();  // Prevent the form from submitting the usual way

            const itemname = document.getElementById('itemname').value;
            const itemdescription = document.getElementById('itemdescription').value;

            // Send the data via fetch
            fetch('http://127.0.0.1:5000/submittodoitem', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    itemname: itemname,
                    itemdescription: itemdescription
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    alert(data.message);  // Success message from backend
                } else {
                    alert('Failed to add item');
                }
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: cream;
    }
    form {
        width: 300px;
        padding: 20px;
        border: 1px solid #ccc;
        justify-content: center;
        margin-top: 50px;
        align-items: center;
        margin: 0 auto;
        border-radius: 10px;
    }
    p {
        text-align: center;
        font-size: 30px;
        font-family: 'Arial Black', sans-serif;
        color: #0207ffff;
    }
</style>
</html>
